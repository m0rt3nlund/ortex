[package]
authors = []
edition = "2021"
name = "ortex"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]
name = "ortex"
path = "src/lib.rs"

[workspace]
resolver = "2"

[dependencies]
half = "2.7.1"
ndarray = "0.17"
num-traits = "0.2.19"
ort-sys = {version = "=2.0.0-rc.13", default-features = false}
rustler = "0.37"
rustls = "0.23.34"
tracing-subscriber = {version = "0.3", features = ["env-filter", "fmt"]}

# DirectML doesn't exist outside Windows
[target.'cfg(windows)'.dependencies]
ort = {version = "2.0.0-rc.13", features = ["half", "cuda", "directml", "tensorrt"]}

# default-features = false + explicit api-23: ort's own defaults require a
# newer ONNX Runtime than the one actually installed (pip onnxruntime
# 1.23.0 on Jetson/Linux) for load-dynamic, which ort rejects outright
# (BadVersion) rather than just warning. api-23 matches what's actually
# there; bump this (never past what's installed) if that wheel is upgraded.
[target.'cfg(not(windows))'.dependencies]
ort = {version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "half", "cuda", "tensorrt", "load-dynamic", "api-23"]}

# [profile.dev]
# debug = true # Enables full DWARF/PDB symbols (default on most platforms)

[profile.dev]
opt-level = 3

[features]
# ONNXRuntime Execution providers
coreml = ["ort/coreml"]
directml = ["ort/directml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
acl = ["ort/acl"]
onednn = ["ort/onednn"]
rocm = ["ort/rocm"]
